version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
    groups:
      sumup:
        patterns:
          - "@sumup-oss/*"
      types:
        patterns:
          - "@types/*"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-*"
      expressive-code:
        patterns:
          - "@expressive-code/*"
          - "*expressive-code*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
